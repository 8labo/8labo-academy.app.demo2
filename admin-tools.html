<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACADEMY 管理</title><style>html,body{margin:0;height:100%;background:#f4f7fa}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="outer" src="admin-unified.html"></iframe><script>const outer=document.getElementById('outer');const map={schedule:['schedule','予定を取込'],classes:['classes','教室を取込'],members:['members','所属を取込'],notices:['notices','お知らせを取込']};function wire(){try{const od=outer.contentDocument,inner=od.getElementById('adminFrame');if(!inner)return setTimeout(wire,120);const apply=()=>{try{const doc=inner.contentDocument;if(!doc||!doc.body)return;const header=doc.querySelector('header'),back=doc.querySelector('.adminBack');if(!header||!back)return;doc.querySelectorAll('[data-tab="import"],[data-tab="export"]').forEach(x=>x.style.display='none');let tools=doc.getElementById('academyDataTools');if(!tools){tools=doc.createElement('div');tools.id='academyDataTools';tools.style.cssText='display:flex;gap:4px;align-items:center;margin-left:auto;';tools.innerHTML='<a id="academyImportLink" href="#" style="color:#fff;text-decoration:none;font-size:9px;font-weight:800;padding:5px 8px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:rgba(255,255,255,.08);white-space:nowrap">取込</a><a href="https://8labo.github.io/8labo.app.demo/data-export.html" target="_top" style="color:#fff;text-decoration:none;font-size:9px;font-weight:800;padding:5px 8px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:rgba(255,255,255,.08);white-space:nowrap">データ管理</a>';header.insertBefore(tools,back)}const update=()=>{const on=doc.querySelector('[data-tab].on'),key=on?.dataset.tab,info=map[key]||map.schedule,link=doc.getElementById('academyImportLink');link.textContent=info[1];link.href='academy-data-import.html?type='+info[0];link.target='_top'};doc.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTimeout(update,0)));update();if(!doc.getElementById('academyAdminPermissionScript')){const s=doc.createElement('script');s.id='academyAdminPermissionScript';s.src='academy-admin-permissions.js?v=2';doc.head.appendChild(s)}if(!doc.getElementById('academyAdminDataScript')){const d=doc.createElement('script');d.id='academyAdminDataScript';d.src='academy-admin-data-v2.js?v=1';doc.head.appendChild(d)}}catch(e){}};inner.addEventListener('load',()=>setTimeout(apply,60));setTimeout(apply,120)}catch(e){setTimeout(wire,200)}}outer.addEventListener('load',wire);</script></body></html>
