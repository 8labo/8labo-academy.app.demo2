<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACADEMY 予定履歴</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;--bg:#f4f7fa;--blue:#0b4f8a;--ink:#172235;--muted:#748095;--line:#e1e7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{background:var(--blue);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}header b{font-size:18px}header a{font-size:11px;color:#fff;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:22px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{padding:10px;border:1px solid #dce4ec;border-radius:10px;background:#fff}.item{padding:13px 0;border-top:1px solid #edf1f4}.item:first-child{border-top:0}.item b{font-size:13px}.meta{font-size:10px;color:var(--muted);margin-top:5px}.empty{font-size:12px;color:#9aa4b2;padding:18px 0}</style></head><body><header><b>8LABO ACADEMY｜予定履歴</b><a href="admin-access.html">← ACADEMY管理に戻る</a></header><main class="wrap"><div class="card"><div class="toolbar"><select id="classFilter"><option value="">すべての教室</option></select><input id="search" placeholder="予定名・会場を検索"><input id="from" type="date"><input id="to" type="date"></div><div id="list">読み込み中…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://uksoinulgbchzvvbcezi.supabase.co','sb_publishable_fm6TZ6GTN8papKDtKakX9w_O5Vf8Oax'),$=id=>document.getElementById(id);let rows=[],classes=[];const today=()=>new Date().toISOString().slice(0,10);async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return $('list').textContent='ログインが必要です。';const{data:s}=await sb.from('services').select('id').eq('service_code','ACADEMY').single();const{data:ok}=await sb.rpc('has_service_access',{target_service_id:s.id});if(!ok)return $('list').textContent='管理権限がありません。';let r=await sb.from('academy_classes').select('id,class_name').order('class_name');classes=r.data||[];$('classFilter').innerHTML='<option value="">すべての教室</option>'+classes.map(x=>`<option value="${x.id}">${x.class_name}</option>`).join('');r=await sb.from('academy_schedule').select('*,academy_classes(class_name)').lt('schedule_date',today()).order('schedule_date',{ascending:false}).limit(1000);rows=r.data||[];render()}function render(){const q=$('search').value.trim().toLowerCase(),cf=$('classFilter').value,from=$('from').value,to=$('to').value;const a=rows.filter(x=>(!cf||x.class_id===cf)&&(!from||x.schedule_date>=from)&&(!to||x.schedule_date<=to)&&(!q||`${x.title} ${x.venue||''} ${x.academy_classes?.class_name||''}`.toLowerCase().includes(q)));$('list').innerHTML=a.map(x=>`<div class="item"><b>${x.schedule_date}｜${x.title}</b><div class="meta">${x.academy_classes?.class_name||'全体'}｜${(x.start_time||'').slice(0,5)}${x.end_time?'〜'+x.end_time.slice(0,5):''}${x.venue?'｜'+x.venue:''}</div></div>`).join('')||'<div class="empty">該当する履歴はありません。</div>'}['search','classFilter','from','to'].forEach(id=>$(id).oninput=render);boot();</script></body></html>
