<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8LABO ACADEMY 定期教室一括登録</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;background:#f4f7fa;color:#172235}header{background:#0b4f8a;color:#fff;padding:18px 22px}header b{font-size:18px}header span{font-size:11px;opacity:.7;margin-left:8px}.wrap{max-width:980px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e1e7ed;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(25,55,85,.05)}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}h2{font-size:18px;margin:0 0 5px}.sub{font-size:12px;color:#748095;margin:0 0 18px;line-height:1.7}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:800;color:#596679;margin-bottom:6px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #dce4ec;border-radius:11px;background:#fbfcfd}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{border:0;background:#0b4f8a;color:#fff;padding:13px 16px;border-radius:11px;font-weight:900;width:100%}.ghost{border:1px solid #dce4ec;background:#fff;color:#0b4f8a;padding:9px 12px;border-radius:10px;font-weight:800}.hidden{display:none!important}.status{padding:11px 12px;border-radius:10px;background:#edf6fb;color:#315f84;font-size:11px;line-height:1.6;margin-top:12px}.success{background:#edf8f2;color:#287653}.danger{background:#fff1f1;color:#a64040}.calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.calHead b{font-size:17px}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.week div{text-align:center;font-size:10px;color:#7b8796;padding:4px}.day{height:58px;border:1px solid #e3e9ef;border-radius:12px;background:#fbfcfd;color:#344055;display:flex;align-items:flex-start;justify-content:flex-end;padding:8px;font-size:12px;font-weight:800;cursor:pointer;position:relative}.day:hover{border-color:#8fb7d8}.day.other{opacity:.28;pointer-events:none}.day.past{opacity:.35;pointer-events:none}.day.selected{background:#0b4f8a;color:#fff;border-color:#0b4f8a}.day.selected:after{content:'✓';position:absolute;left:8px;bottom:7px;font-size:12px}.selectedBox{margin-top:16px;border-top:1px solid #edf1f4;padding-top:14px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chip{background:#eef4fb;color:#315f84;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:800}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.back{color:#0b4f8a;text-decoration:none;font-size:12px;font-weight:800}.help{font-size:10px;color:#7b8796;line-height:1.6;margin-top:5px}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.day{height:48px;padding:6px}.row{grid-template-columns:1fr}}</style></head><body><header><b>8LABO ACADEMY 管理</b><span>定期教室 一括登録</span></header><div class="wrap"><div class="topbar"><a class="back" href="admin.html">← 管理画面へ戻る</a><span style="font-size:10px;color:#7b8796">REGULAR LESSON</span></div><div id="gate" class="card"><h2>権限を確認しています</h2><p class="sub">スタッフ権限を確認しています。</p></div><div id="app" class="grid hidden"><div class="card"><h2>教室の基礎情報</h2><p class="sub">ここで設定した内容を、選択したすべての日付へまとめて登録します。</p><div class="field"><label>教室</label><select id="classSel"><option value="">選択してください</option></select></div><div class="field"><label>タイトル</label><input id="title" placeholder="清水教室"></div><div class="field"><label>会場</label><input id="venue"></div><div class="row"><div class="field"><label>開始</label><input id="start" type="time"></div><div class="field"><label>終了</label><input id="end" type="time"></div></div><div class="field"><label>公開設定</label><select id="pubMode"><option value="now">今すぐ公開</option><option value="reserve">公開日時を指定</option></select></div><div id="pubWrap" class="field hidden"><label>公開日時</label><input id="pubAt" type="datetime-local"></div><div class="help">既に同じ日・同じ教室の予定がある日は、自動的にスキップします。</div><button id="save" class="primary" style="margin-top:16px">選択した日付を一括登録</button><div id="status" class="status hidden"></div></div><div class="card"><div class="calHead"><button id="prev" class="ghost">‹ 前月</button><b id="monthTitle"></b><button id="next" class="ghost">翌月 ›</button></div><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div id="calendar" class="calendar"></div><div class="selectedBox"><b style="font-size:12px">選択中：<span id="count">0</span>日</b><div id="chips" class="chips"><span style="font-size:10px;color:#7b8796">カレンダーの日付をクリックしてください。</span></div></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://uksoinulgbchzvvbcezi.supabase.co',K='sb_publishable_fm6TZ6GTN8papKDtKakX9w_O5Vf8Oax',sb=window.supabase.createClient(U,K),$=s=>document.querySelector(s);let classes=[],selected=new Set(),view=new Date();view=new Date(view.getFullYear(),view.getMonth(),1);function isoDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function render(){const y=view.getFullYear(),m=view.getMonth();$('#monthTitle').textContent=`${y}年 ${m+1}月`;const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),today=new Date();today.setHours(0,0,0,0);let html='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=isoDate(d),other=d.getMonth()!==m,past=d<today;html+=`<button type="button" class="day ${other?'other':''} ${past?'past':''} ${selected.has(key)?'selected':''}" data-date="${key}">${d.getDate()}</button>`}$('#calendar').innerHTML=html;document.querySelectorAll('.day:not(.other):not(.past)').forEach(b=>b.onclick=()=>{selected.has(b.dataset.date)?selected.delete(b.dataset.date):selected.add(b.dataset.date);render();renderSelected()});renderSelected()}function renderSelected(){const arr=[...selected].sort();$('#count').textContent=arr.length;$('#chips').innerHTML=arr.length?arr.map(x=>`<span class="chip">${x.replaceAll('-','/')}</span>`).join(''):'<span style="font-size:10px;color:#7b8796">カレンダーの日付をクリックしてください。</span>'}$('#prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('#next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$('#pubMode').onchange=()=>$('#pubWrap').classList.toggle('hidden',$('#pubMode').value!=='reserve');$('#classSel').onchange=()=>{const c=classes.find(x=>x.id===$('#classSel').value);if(!c)return;$('#title').value=c.class_name||'';$('#venue').value=c.venue||'';if(c.start_time)$('#start').value=c.start_time.slice(0,5);if(c.end_time)$('#end').value=c.end_time.slice(0,5)};async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){$('#gate').innerHTML='<h2>ログインが必要です</h2><p class="sub">共通アプリでログインしてから開いてください。</p>';return}const{data:staff}=await sb.from('staff_users').select('id').eq('auth_user_id',session.user.id).eq('staff_status','active').maybeSingle();if(!staff){$('#gate').innerHTML='<h2>アクセス権限がありません</h2>';return}const{data,error}=await sb.from('academy_classes').select('*').eq('status','active').order('class_name');if(error){$('#gate').innerHTML='<h2>教室情報を取得できませんでした</h2>';return}classes=data||[];$('#classSel').innerHTML='<option value="">選択してください</option>'+classes.map(c=>`<option value="${c.id}">${c.class_name}</option>`).join('');$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');render()}$('#save').onclick=async()=>{const st=$('#status');st.className='status';st.classList.remove('hidden');const cid=$('#classSel').value,title=$('#title').value.trim(),dates=[...selected].sort();if(!cid)return st.textContent='教室を選択してください。';if(!title)return st.textContent='タイトルを入力してください。';if(!dates.length)return st.textContent='開催日を1日以上選択してください。';if($('#pubMode').value==='reserve'&&!$('#pubAt').value)return st.textContent='公開日時を指定してください。';st.textContent='重複を確認しています…';const{data:existing,error:ee}=await sb.from('academy_schedule').select('schedule_date').eq('class_id',cid).in('schedule_date',dates);if(ee){st.classList.add('danger');st.textContent='確認エラー：'+ee.message;return}const exists=new Set((existing||[]).map(x=>x.schedule_date)),targets=dates.filter(d=>!exists.has(d)),skipped=dates.filter(d=>exists.has(d));if(!targets.length){st.classList.add('danger');st.textContent=`選択した${dates.length}日はすべて登録済みです。重複登録は行いませんでした。`;return}const publishAt=$('#pubMode').value==='reserve'?new Date($('#pubAt').value).toISOString():new Date().toISOString();const rows=targets.map(d=>({schedule_type:'lesson',class_id:cid,title,schedule_date:d,start_time:$('#start').value||null,end_time:$('#end').value||null,venue:$('#venue').value.trim()||null,audience:'class',publish_at:publishAt,is_published:true}));const{error}=await sb.from('academy_schedule').insert(rows);if(error){st.classList.add('danger');st.textContent='登録エラー：'+error.message;return}st.classList.add('success');st.textContent=`${targets.length}件を登録しました。${skipped.length?` 重複していた${skipped.length}件（${skipped.join('、')}）はスキップしました。`:''}`;selected.clear();render()};boot();</script></body></html>
