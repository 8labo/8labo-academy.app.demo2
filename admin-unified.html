<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8LABO ACADEMY 管理</title><style>html,body{margin:0;height:100%;background:#f4f7fa}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="adminFrame" src="admin.html"></iframe><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://uksoinulgbchzvvbcezi.supabase.co','sb_publishable_fm6TZ6GTN8papKDtKakX9w_O5Vf8Oax');
const frame=document.getElementById('adminFrame');let mode='active',limit=20,editing=null,notices=[],classes=[],members=[],acks=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const dt=v=>{if(!v)return'';const d=new Date(v);return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};
function style(doc){const st=doc.createElement('style');st.textContent=`.noticeSwitch{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}.noticeSwitch button{border:1px solid #dce4ec;background:#fff;color:#637083;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900}.noticeSwitch button.on{background:#172235;color:#fff;border-color:#172235}.moreBtn{display:block;margin:14px auto 0;border:1px solid #dce4ec;background:#fff;color:#0b4f8a;border-radius:12px;padding:9px 18px;font-size:11px;font-weight:900}.noticeMeta{font-size:10px;color:#748095;margin-top:4px;line-height:1.6}.noticeActions{display:flex;gap:6px;flex-wrap:wrap}.noticeStatus{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900;margin-left:5px}.nsActive{background:#e9f6ef;color:#287b56}.nsReserve{background:#eef4fb;color:#35658e}.nsDraft{background:#fff3df;color:#b56d00}.nsPast{background:#eef1f4;color:#667085}`;doc.head.appendChild(st)}
function panelHTML(){return `<div class="grid"><div class="card"><h2>お知らせを登録</h2><p class="sub">公開中・過去・下書きを同じ画面で管理します。</p><input type="hidden" id="uxId"><div class="field"><label>タイトル</label><input id="uxTitle"></div><div class="field"><label>本文</label><textarea id="uxBody" rows="5"></textarea></div><div class="field"><label>対象</label><select id="uxTarget"><option value="academy">ACADEMY全体</option><option value="class">特定教室</option></select></div><div id="uxClassWrap" class="field hidden"><label>教室</label><select id="uxClass"></select></div><div class="field check"><input id="uxImportant" type="checkbox"><label for="uxImportant">重要なお知らせにする</label></div><div class="row"><div class="field"><label>公開状態</label><select id="uxStatus"><option value="published">公開する</option><option value="draft">下書き</option></select></div><div class="field"><label>公開日時</label><input id="uxPublish" type="datetime-local"></div></div><div class="field"><label>掲載終了日時（任意）</label><input id="uxExpire" type="datetime-local"><div class="muted" style="font-size:10px;margin-top:5px">設定すると、この日時を過ぎた後は自動で「過去のお知らせ」に移動します。</div></div><div class="actions"><button class="primary" id="uxSave">保存する</button><button class="ghost hidden" id="uxCancel">編集をやめる</button></div></div><div class="card"><h2>お知らせ一覧</h2><p class="sub">20件ずつ表示し、必要な場合だけ「もっと見る」で追加表示します。</p><div class="noticeSwitch"><button class="on" data-nmode="active">公開中</button><button data-nmode="past">過去のお知らせ</button><button data-nmode="draft">下書き</button></div><div id="uxList"></div><button id="uxMore" class="moreBtn hidden">もっと見る</button></div></div>`}
frame.addEventListener('load',async()=>{const doc=frame.contentDocument;style(doc);const panel=doc.getElementById('notices');if(!panel)return;panel.innerHTML=panelHTML();bind(doc);await load(doc)});
function bind(doc){doc.getElementById('uxTarget').onchange=()=>doc.getElementById('uxClassWrap').classList.toggle('hidden',doc.getElementById('uxTarget').value!=='class');doc.querySelectorAll('[data-nmode]').forEach(b=>b.onclick=()=>{mode=b.dataset.nmode;limit=20;doc.querySelectorAll('[data-nmode]').forEach(x=>x.classList.toggle('on',x===b));render(doc)});doc.getElementById('uxMore').onclick=()=>{limit+=20;render(doc)};doc.getElementById('uxSave').onclick=()=>save(doc);doc.getElementById('uxCancel').onclick=()=>clear(doc)}
async function load(doc){const [n,c,m,a]=await Promise.all([sb.from('academy_notices').select('*').order('published_at',{ascending:false}),sb.from('academy_classes').select('id,class_name').order('class_name'),sb.from('academy_class_members').select('person_id,class_id,membership_status,persons(labo_id,last_name,first_name)'),sb.from('academy_notice_acknowledgements').select('notice_id,person_id,acknowledged_at')]);if(n.error||c.error||m.error||a.error){doc.getElementById('uxList').textContent=(n.error||c.error||m.error||a.error).message;return}notices=n.data||[];classes=c.data||[];members=m.data||[];acks=a.data||[];doc.getElementById('uxClass').innerHTML=classes.map(x=>`<option value="${x.id}">${esc(x.class_name)}</option>`).join('');render(doc)}
function bucket(x){const now=Date.now();if(!x.is_published)return'draft';if(x.expires_at&&new Date(x.expires_at).getTime()<=now)return'past';return'active'}
function sorted(){return notices.filter(x=>bucket(x)===mode).sort((a,b)=>(Number(b.is_important)-Number(a.is_important))||new Date(b.published_at||b.created_at)-new Date(a.published_at||a.created_at))}
function render(doc){const all=sorted(),list=all.slice(0,limit),now=Date.now();doc.getElementById('uxList').innerHTML=list.map(x=>{const reserve=x.is_published&&new Date(x.published_at).getTime()>now;const status=bucket(x)==='draft'?'<span class="noticeStatus nsDraft">下書き</span>':bucket(x)==='past'?'<span class="noticeStatus nsPast">掲載終了</span>':reserve?'<span class="noticeStatus nsReserve">公開予約</span>':'<span class="noticeStatus nsActive">公開中</span>';return `<div class="item"><div class="itemMain"><b>${esc(x.title)} ${x.is_important?'<span class="badge important">重要</span>':''} ${status}</b><div class="noticeMeta">公開：${x.published_at?new Date(x.published_at).toLocaleString('ja-JP'):'—'}${x.expires_at?'｜終了：'+new Date(x.expires_at).toLocaleString('ja-JP'):''}</div></div><div class="noticeActions"><button class="ghost small" data-ackid="${x.id}">確認状況</button><button class="ghost small" data-editid="${x.id}">編集</button>${bucket(x)==='past'?`<button class="ghost small" data-reopen="${x.id}">再公開</button>`:x.is_published?`<button class="ghost small" data-end="${x.id}">掲載終了</button>`:''}<button class="dangerBtn small" data-delid="${x.id}">削除</button></div></div>`}).join('')||'<span class="muted">該当するお知らせはありません。</span>';doc.getElementById('uxMore').classList.toggle('hidden',all.length<=limit);doc.querySelectorAll('[data-editid]').forEach(b=>b.onclick=()=>edit(doc,b.dataset.editid));doc.querySelectorAll('[data-delid]').forEach(b=>b.onclick=()=>del(doc,b.dataset.delid));doc.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>end(doc,b.dataset.end));doc.querySelectorAll('[data-reopen]').forEach(b=>b.onclick=()=>reopen(doc,b.dataset.reopen));doc.querySelectorAll('[data-ackid]').forEach(b=>b.onclick=()=>ack(doc,b.dataset.ackid))}
function edit(doc,id){const x=notices.find(n=>n.id===id);editing=id;doc.getElementById('uxId').value=id;doc.getElementById('uxTitle').value=x.title;doc.getElementById('uxBody').value=x.body;doc.getElementById('uxTarget').value=x.target_type||'academy';doc.getElementById('uxClass').value=x.class_id||'';doc.getElementById('uxClassWrap').classList.toggle('hidden',x.target_type!=='class');doc.getElementById('uxImportant').checked=!!x.is_important;doc.getElementById('uxStatus').value=x.is_published?'published':'draft';doc.getElementById('uxPublish').value=dt(x.published_at);doc.getElementById('uxExpire').value=dt(x.expires_at);doc.getElementById('uxCancel').classList.remove('hidden');doc.getElementById('uxTitle').scrollIntoView({behavior:'smooth',block:'center'})}
function clear(doc){editing=null;['uxId','uxTitle','uxBody','uxPublish','uxExpire'].forEach(id=>doc.getElementById(id).value='');doc.getElementById('uxTarget').value='academy';doc.getElementById('uxClassWrap').classList.add('hidden');doc.getElementById('uxImportant').checked=false;doc.getElementById('uxStatus').value='published';doc.getElementById('uxCancel').classList.add('hidden')}
async function save(doc){const title=doc.getElementById('uxTitle').value.trim(),body=doc.getElementById('uxBody').value.trim();if(!title||!body)return alert('タイトルと本文を入力してください。');const target=doc.getElementById('uxTarget').value;const p={title,body,target_type:target,class_id:target==='class'?doc.getElementById('uxClass').value:null,is_important:doc.getElementById('uxImportant').checked,is_published:doc.getElementById('uxStatus').value==='published',published_at:doc.getElementById('uxPublish').value?new Date(doc.getElementById('uxPublish').value).toISOString():new Date().toISOString(),expires_at:doc.getElementById('uxExpire').value?new Date(doc.getElementById('uxExpire').value).toISOString():null,updated_at:new Date().toISOString()};const r=editing?await sb.from('academy_notices').update(p).eq('id',editing):await sb.from('academy_notices').insert(p);if(r.error)return alert(r.error.message);clear(doc);await load(doc)}
async function del(doc,id){if(!confirm('このお知らせを削除しますか？'))return;const r=await sb.from('academy_notices').delete().eq('id',id);if(r.error)return alert(r.error.message);await load(doc)}
async function end(doc,id){const r=await sb.from('academy_notices').update({expires_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);await load(doc)}
async function reopen(doc,id){const r=await sb.from('academy_notices').update({is_published:true,expires_at:null,published_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);await load(doc)}
async function ack(doc,id){const n=notices.find(x=>x.id===id);let target;if(n.target_type==='class'&&n.class_id)target=members.filter(m=>m.class_id===n.class_id&&m.membership_status==='active');else{const seen=new Set();target=members.filter(m=>m.membership_status==='active'&&!seen.has(m.person_id)&&seen.add(m.person_id))}const aa=acks.filter(a=>a.notice_id===id),map=new Map(aa.map(a=>[a.person_id,a]));const html=`<div class="ackSummary"><button class="ackStat on">対象者<b>${target.length}名</b></button><button class="ackStat">確認済み<b>${target.filter(m=>map.has(m.person_id)).length}名</b></button><button class="ackStat">未確認<b>${target.filter(m=>!map.has(m.person_id)).length}名</b></button></div><div class="ackList">${target.map(m=>{const a=map.get(m.person_id),p=m.persons||{};return `<div class="ackPerson"><b>${esc(p.last_name)} ${esc(p.first_name)} <span class="badge ackBadge">ID ${String(p.labo_id||'').padStart(4,'0')}</span></b><span>${a?new Date(a.acknowledged_at).toLocaleString('ja-JP')+' 確認':'未確認'}</span></div>`}).join('')}</div>`;doc.getElementById('modalTitle').textContent='確認状況｜'+n.title;doc.getElementById('modalBody').innerHTML=html;doc.getElementById('modal').classList.remove('hidden')}
</script></body></html>
