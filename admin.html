function ymd(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function renderCal(){if(!$('#calendar'))return;let y=calDate.getFullYear(),m=calDate.getMonth();$('#monthLabel').textContent=`${y}年 ${m+1}月`;let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),cid=$('#bClass')?.value;let html='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=ymd(d.getFullYear(),d.getMonth(),d.getDate()),off=d.getMonth()!==m,ex=cid&&schedules.some(x=>x.class_id===cid&&x.schedule_date===key);html+=`<button class="day ${off?'off':''} ${selected.has(key)?'selected':''} ${ex?'exists':''}" data-day="${key}">${d.getDate()}</button>`}$('#calendar').innerHTML=html;$$('[data-day]').forEach(b=>b.onclick=()=>{selected.has(b.dataset.day)?selected.delete(b.dataset.day):selected.add(b.dataset.day);renderCal()});$('#selectedText').textContent=selected.size?`選択中：${[...selected].sort().join('、')}（${selected.size}日）`:'開催日を選択してください。'}$('#prev').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderCal()};$('#next').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderCal()};
$('#bulkSave').onclick=async()=>{let cid=$('#bClass').value;if(!cid||!selected.size)return alert('教室と開催日を選択してください');let existing=new Set(schedules.filter(x=>x.class_id===cid).map(x=>x.schedule_date)),dates=[...selected].filter(d=>!existing.has(d)),skip=selected.size-dates.length;if(!dates.length)return alert('選択した日はすべて登録済みです');let rows=dates.map(d=>({schedule_type:'lesson',class_id:cid,title:$('#bTitle').value,schedule_date:d,start_time:$('#bStart').value||null,end_time:$('#bEnd').value||null,venue:$('#bVenue').value||null,venue_address:$('#bAddress').value||null,audience:'class',publish_at:new Date().toISOString(),is_published:true}));let{error}=await sb.from('academy_schedule').insert(rows);if(error)return alert(error.message);$('#bulkStatus').classList.remove('hidden');$('#bulkStatus').textContent=`${rows.length}件登録しました。${skip?skip+'件は重複のためスキップしました。':''}`;selected.clear();await refresh()};
function parseCSV(t){let a=t.replace(/^\uFEFF/,'').trim().split(/\r?\n/).map(r=>r.split(','));let h=a.shift().map(x=>x.trim());return a.map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()]))) }let csv=[];$('#csvFile').onchange=async e=>{csv=parseCSV(await e.target.files[0].text());$('#preview').innerHTML=`${csv.length}件を読み込みました`;$('#runImport').classList.remove('hidden')};$('#runImport').onclick=()=>alert('CSV一括登録は従来形式を利用してください。定期教室は「定期教室一括登録」が簡単です。');function csvCell(v){let s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}function dl(name,heads,rows){let text='\uFEFF'+heads.join(',')+'\r\n'+rows.map(r=>heads.map(h=>csvCell(r[h])).join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click()}$$('[data-export]').forEach(b=>b.onclick=async()=>{let t=b.dataset.export,table={classes:'academy_classes',schedule:'academy_schedule',members:'academy_class_members',notices:'academy_notices'}[t],{data,error}=await sb.from(table).select('*');if(error)return alert(error.message);let heads=data?.length?Object.keys(data[0]):[];dl(t+'.csv',heads,data||[])});boot();
</script></body></html>
