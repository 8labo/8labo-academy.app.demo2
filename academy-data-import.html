<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACADEMY データ取込</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;--bg:#f4f7fa;--ink:#172235;--muted:#748095;--line:#dfe7ee;--blue:#0b4f8a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}header{height:64px;background:#0b4f8a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 900px)/2))}header a{color:#fff;text-decoration:none;font-size:11px;opacity:.9}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:24px 0 60px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}.card h1{font-size:21px;margin:0 0 5px}.card h2{font-size:16px;margin:0 0 6px}.sub,.hint{font-size:11px;color:var(--muted);line-height:1.7}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.field{flex:1;min-width:180px}.field label{display:block;font-size:10px;font-weight:800;margin:0 0 5px}.field select,.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:10px;font-weight:900;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.status{font-size:11px;padding:10px 12px;border-radius:10px;background:#eef5fb;color:#315f84;margin-top:10px}.preview{overflow:auto;max-height:360px;border:1px solid var(--line);border-radius:12px;margin-top:12px}.preview table{border-collapse:collapse;width:100%;font-size:9px;white-space:nowrap}.preview th,.preview td{padding:7px;border-bottom:1px solid #eef1f4;text-align:left}.preview th{background:#f8fafc;position:sticky;top:0}.hidden{display:none!important}</style></head><body><header><b>ACADEMY データ取込</b><a href="admin-access.html">← ACADEMY管理へ</a></header><main class="wrap"><div class="card"><h1 id="title">データをインポート</h1><p class="sub" id="desc"></p><div class="row"><button id="template" class="btn">インポート用フォーマットをダウンロード</button><a class="btn" href="https://8labo.github.io/8labo.app.demo/data-export.html" style="text-decoration:none;color:inherit">データ管理センター</a></div></div><div class="card"><h2>CSVを読み込む</h2><div class="row"><div class="field"><label>データ種別</label><select id="type"><option value="schedule">予定</option><option value="classes">教室</option><option value="members">所属</option><option value="notices">お知らせ</option></select></div><div class="field"><label>CSVファイル</label><input id="file" type="file" accept=".csv,text/csv"></div></div><div class="hint" id="guide"></div><div id="status" class="status">CSVを選択してください。</div><div id="preview" class="preview hidden"></div><div class="row" style="margin-top:12px"><button id="run" class="btn primary" disabled>内容を確認して登録</button></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><script>const sb=supabase.createClient('https://uksoinulgbchzvvbcezi.supabase.co','sb_publishable_fm6TZ6GTN8papKDtKakX9w_O5Vf8Oax'),$=x=>document.getElementById(x);let rows=[],academyService=null;const defs={schedule:{title:'予定をインポート',desc:'教室・イベント・休講などの予定をまとめて登録します。',headers:['種類（schedule_type）','教室コード（class_code）','タイトル（title）','日付（schedule_date）','開始（start_time）','終了（end_time）','会場（venue）','住所（venue_address）','公開（is_published）','備考（notes）'],example:['教室','SHIMIZU','清水教室','2026-09-04','18:10','19:00','清水公民館','','はい',''],guide:'必須：タイトル、日付。教室を指定する場合は教室コードを入力してください。種類は「教室・イベント・休講・その他」を日本語入力できます。'},classes:{title:'教室をインポート',desc:'ACADEMYの教室情報をまとめて登録・更新します。',headers:['教室コード（class_code）','教室名（class_name）','レベル（level_code）','会場（venue）','住所（venue_address）','曜日（weekday）','開始（start_time）','終了（end_time）','定員（capacity）','状態（status）','備考（notes）'],example:['SHIMIZU','清水教室','G','清水公民館','','金','18:10','19:00','10','利用中',''],guide:'教室コードと教室名は必須です。同じ教室コードがある場合は更新します。曜日は「日〜土」または0〜6で入力できます。'},members:{title:'所属をインポート',desc:'８LABO IDと教室コードを使って所属をまとめて登録します。',headers:['８LABO ID（labo_id）','教室コード（class_code）','所属状態（membership_status）','開始日（started_at）','終了日（ended_at）','備考（notes）'],example:['0001','SHIMIZU','在籍','2026-04-01','',''],guide:'８LABO IDと教室コードは必須です。同じ人物×教室がある場合は所属状態等を更新します。'},notices:{title:'お知らせをインポート',desc:'ACADEMYのお知らせをまとめて登録します。',headers:['タイトル（title）','本文（body）','対象（target_type）','教室コード（class_code）','重要（is_important）','公開（is_published）','公開日時（published_at）','掲載終了（expires_at）'],example:['9月のお知らせ','9月の予定をご確認ください。','全体','','いいえ','はい','2026-08-20 10:00',''],guide:'タイトルと本文は必須です。対象は「全体」または「教室」。教室の場合は教室コードも入力してください。'}};const aliases={};Object.values(defs).forEach(d=>d.headers.forEach(h=>{const m=h.match(/^(.+)（(.+)）$/);if(m){aliases[h]=m[2];aliases[m[1]]=m[2];aliases[m[2]]=m[2]}}));function norm(r){const o={};Object.entries(r).forEach(([k,v])=>o[aliases[k.trim()]||k.trim()]=typeof v==='string'?v.trim():v);return o}function bool(v,def=true){if(v===''||v==null)return def;return ['true','1','yes','y','はい','公開','する'].includes(String(v).toLowerCase())}const typeMap={教室:'lesson',イベント:'event',休講:'closure',その他:'other'},statusMap={利用中:'active',在籍:'active',休止:'paused',退会:'withdrawn',停止:'inactive'},targetMap={全体:'academy',教室:'class'},weekdayMap={日:0,月:1,火:2,水:3,木:4,金:5,土:6};function csv(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replaceAll('"','""')+'"':v}function dl(name,d){const text='\ufeff'+[d.headers.map(csv).join(','),d.example.map(csv).join(',')].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function setType(v){const d=defs[v];$('title').textContent=d.title;$('desc').textContent=d.desc;$('guide').textContent=d.guide;history.replaceState(null,'','?type='+v)}function show(){if(!rows.length)return;$('preview').innerHTML='<table><thead><tr>'+Object.keys(rows[0]).map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(0,50).map(r=>'<tr>'+Object.keys(rows[0]).map(k=>'<td>'+String(r[k]??'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>';$('preview').classList.remove('hidden');$('run').disabled=false;$('status').textContent=`${rows.length}件を読み込みました。内容を確認してください。`}async function maps(){let r=await sb.from('academy_classes').select('id,class_code');const cls=new Map((r.data||[]).map(x=>[String(x.class_code).toUpperCase(),x.id]));r=await sb.from('persons').select('id,labo_id');const ppl=new Map((r.data||[]).map(x=>[String(x.labo_id).replace(/^0+/,''),x.id]));return{cls,ppl}}async function run(){const t=$('type').value,{cls,ppl}=await maps();let ok=0,err=[];for(let i=0;i<rows.length;i++){const x=norm(rows[i]);try{if(t==='classes'){if(!x.class_code||!x.class_name)throw Error('教室コード・教室名が必要です');let w=x.weekday;if(w in weekdayMap)w=weekdayMap[w];const row={class_code:x.class_code,class_name:x.class_name,level_code:x.level_code||null,venue:x.venue||null,venue_address:x.venue_address||null,weekday:w===''||w==null?null:+w,start_time:x.start_time||null,end_time:x.end_time||null,capacity:x.capacity?+x.capacity:null,status:statusMap[x.status]||x.status||'active',notes:x.notes||null,updated_at:new Date().toISOString()};const ex=cls.get(String(x.class_code).toUpperCase());const r=ex?await sb.from('academy_classes').update(row).eq('id',ex):await sb.from('academy_classes').insert(row);if(r.error)throw r.error}else if(t==='schedule'){if(!x.title||!x.schedule_date)throw Error('タイトル・日付が必要です');const classId=x.class_code?cls.get(String(x.class_code).toUpperCase()):null;if(x.class_code&&!classId)throw Error('教室コードが見つかりません');const row={schedule_type:typeMap[x.schedule_type]||x.schedule_type||'lesson',class_id:classId||null,title:x.title,schedule_date:x.schedule_date,start_time:x.start_time||null,end_time:x.end_time||null,venue:x.venue||null,venue_address:x.venue_address||null,audience:classId?'class':'academy',is_published:bool(x.is_published,true),publish_at:new Date().toISOString(),notes:x.notes||null};const r=await sb.from('academy_schedule').insert(row);if(r.error)throw r.error}else if(t==='members'){if(!x.labo_id||!x.class_code)throw Error('８LABO ID・教室コードが必要です');const pid=ppl.get(String(x.labo_id).replace(/^0+/,'')),cid=cls.get(String(x.class_code).toUpperCase());if(!pid)throw Error('８LABO IDが見つかりません');if(!cid)throw Error('教室コードが見つかりません');const row={person_id:pid,class_id:cid,membership_status:statusMap[x.membership_status]||x.membership_status||'active',started_at:x.started_at||null,ended_at:x.ended_at||null,notes:x.notes||null,updated_at:new Date().toISOString()};const r=await sb.from('academy_class_members').upsert(row,{onConflict:'person_id,class_id'});if(r.error)throw r.error}else{if(!x.title||!x.body)throw Error('タイトル・本文が必要です');const tt=targetMap[x.target_type]||x.target_type||'academy',cid=tt==='class'?cls.get(String(x.class_code||'').toUpperCase()):null;if(tt==='class'&&!cid)throw Error('教室コードが見つかりません');const row={title:x.title,body:x.body,target_type:tt,class_id:cid||null,is_important:bool(x.is_important,false),is_published:bool(x.is_published,true),published_at:x.published_at?new Date(x.published_at).toISOString():new Date().toISOString(),expires_at:x.expires_at?new Date(x.expires_at).toISOString():null};const r=await sb.from('academy_notices').insert(row);if(r.error)throw r.error}ok++}catch(e){err.push(`${i+2}行目：${e.message}`)}}$('status').textContent=`登録 ${ok}件${err.length?'／エラー '+err.length+'件：'+err.slice(0,5).join('｜'):''}`;if(!err.length)$('run').disabled=true}async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session){$('status').textContent='共通ポータルでログインしてください。';return}let r=await sb.from('services').select('id').eq('service_code','ACADEMY').single();academyService=r.data;if(!academyService){$('status').textContent='ACADEMYサービス情報を取得できません。';return}const{data:ok}=await sb.rpc('has_service_access',{target_service_id:academyService.id});if(!ok){$('status').textContent='ACADEMY管理権限がありません。';return}const q=new URLSearchParams(location.search).get('type')||'schedule';$('type').value=defs[q]?q:'schedule';setType($('type').value)}$('type').onchange=()=>setType($('type').value);$('template').onclick=()=>dl(`academy_${$('type').value}_import.csv`,defs[$('type').value]);$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;Papa.parse(f,{header:true,skipEmptyLines:true,complete:r=>{rows=r.data||[];show()},error:e=>$('status').textContent=e.message})};$('run').onclick=run;boot();</script></body></html>
