<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8LABO VAPID Key Generator</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fa;color:#172235;margin:0;padding:28px}.wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #e1e7ed;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(25,55,85,.05)}h1{font-size:22px;margin:0 0 8px}.sub{color:#748095;font-size:13px;line-height:1.7}.field{margin:18px 0}label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}textarea{width:100%;min-height:88px;border:1px solid #dce4ec;border-radius:12px;padding:12px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;box-sizing:border-box}button{border:0;border-radius:12px;background:#0b4f8a;color:#fff;padding:12px 16px;font-weight:900;cursor:pointer}.copy{background:#fff;color:#0b4f8a;border:1px solid #cfdbe6;margin-top:7px}.warn{background:#fff7e8;border-radius:12px;padding:12px 14px;color:#8a641d;font-size:12px;line-height:1.6;margin:15px 0}.ok{background:#edf8f2;color:#287653;border-radius:12px;padding:11px 13px;font-size:12px;margin-top:14px;display:none}</style></head><body><div class="wrap"><div class="card"><h1>VAPID鍵生成</h1><p class="sub">このページはブラウザ内だけでP-256鍵を生成します。生成した秘密鍵は自動送信・保存されません。</p><div class="warn">Private Keyはこのチャットには貼らず、SupabaseのSecretsへ直接登録してください。</div><button id="gen">新しいVAPID鍵を生成</button><div id="result" style="display:none"><div class="field"><label>VAPID_PUBLIC_KEY</label><textarea id="pub" readonly></textarea><button class="copy" data-copy="pub">コピー</button></div><div class="field"><label>VAPID_PRIVATE_KEY</label><textarea id="priv" readonly></textarea><button class="copy" data-copy="priv">コピー</button></div><div class="field"><label>VAPID_SUBJECT</label><textarea id="subject">mailto:info@8labo.net</textarea><button class="copy" data-copy="subject">コピー</button></div><div id="ok" class="ok">コピーしました。</div></div></div></div><script>
function b64url(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64urlToBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';let bin=atob(s);return Uint8Array.from(bin,c=>c.charCodeAt(0))}
document.getElementById('gen').onclick=async()=>{try{const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);const pub=await crypto.subtle.exportKey('jwk',kp.publicKey);const priv=await crypto.subtle.exportKey('jwk',kp.privateKey);const x=b64urlToBytes(pub.x),y=b64urlToBytes(pub.y),raw=new Uint8Array(65);raw[0]=4;raw.set(x,1);raw.set(y,33);document.getElementById('pub').value=b64url(raw);document.getElementById('priv').value=priv.d;document.getElementById('result').style.display='block'}catch(e){alert('生成できませんでした: '+e.message)}};
document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const el=document.getElementById(b.dataset.copy);await navigator.clipboard.writeText(el.value);const ok=document.getElementById('ok');ok.style.display='block';setTimeout(()=>ok.style.display='none',1200)});
</script></body></html>
